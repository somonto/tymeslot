# Somonto fork: builds the slim image (no bundled PostgreSQL, as Somonto runs
# it) for linux/amd64 and pushes it to the GitHub Container Registry of the
# organisation. The upstream workflows (Docker Hub, tests) stay disabled in
# this fork. Version scheme: <upstream version>-somonto.<n>, e.g.
# 1.41.0-somonto.1; a tag v1.41.0-somonto.1 builds the same.
name: Somonto image (ghcr.io)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag, e.g. 1.41.0-somonto.1"
        required: true
        default: "1.41.0-somonto.1"
  push:
    tags:
      - "v*-somonto.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/somonto/tymeslot

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="$INPUT_VERSION"; else v="${REF_NAME#v}"; fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-somonto\.[0-9]+$'; then
            echo "Version '$v' is not <x.y.z>-somonto.<n>"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (slim, amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.docker
          target: release-slim
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/somonto/tymeslot
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.description=Tymeslot with the Somonto booking changes (fork of Tymeslot/tymeslot)
          cache-from: type=gha,scope=somonto-amd64
          cache-to: type=gha,scope=somonto-amd64,mode=max

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.version.outputs.version }}"
