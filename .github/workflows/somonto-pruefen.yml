name: Somonto prüfen

# Somonto fork: compiles and tests the `somonto` branch on GitHub (the Mac
# building it has 8 GB and no Elixir). The fork's own tests must pass; in the
# full suite only the upstream tests of the old Quill flow listed in
# somonto/bekannte-abweichungen.txt may fail (see SOMONTO.md).

on:
  push:
    branches: [somonto]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      MIX_ENV: test
      TEST_DB_POOL_SIZE: "10"
      ELIXIR_VERSION: "1.20.4"
      OTP_VERSION: "28.5.0.7"
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: assets/package-lock.json
      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-somonto-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - name: Format (diff as artifact)
        run: |
          mix format
          git diff > format.diff
          git diff --stat
      - uses: actions/upload-artifact@v4
        with:
          name: format-diff
          path: format.diff
      - run: mix compile --warnings-as-errors
      - name: Somonto tests
        run: mix test test/tymeslot_web/live/themes/somonto_quill_details_test.exs --include integration
      - run: npm ci --prefix assets
      - name: JS tests
        working-directory: assets
        run: npx vitest run js/__tests__/attendee_prefill.test.js js/__tests__/iframe_embed.test.js js/__tests__/somonto_weiter_scroll.test.js
      # The full upstream suite; failures must be on somonto/bekannte-abweichungen.txt
      # (tests of the old Quill flow). A new failure turns the run red.
      - name: Full suite against the known differences
        run: |
          mix test > suite.log 2>&1 || true
          tail -3 suite.log
          python3 somonto/suite_abgleich.py suite.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-log
          path: suite.log
          if-no-files-found: ignore
